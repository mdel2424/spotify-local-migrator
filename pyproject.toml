[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spotify-local-migrator"
version = "0.2.0"
description = "Safely inspect local-file occurrences in Spotify playlists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.12,<4",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
spotify-local-migrate = "spotify_local_migrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_local_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
